<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: çentikli/kavisli telefon ekranlarında oyun alanı
         kenarlara kadar uzanır. Ölçek erişilebilirlik için serbest bırakıldı. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- index.html'in tarayıcıda önbelleğe alınıp ESKİ (artık sunucuda olmayan)
         JS parçalarını istemeye devam etmesi, telefonda "gizli sekmede çalışıyor
         ama normal sekmede hata veriyor" tablosunun klasik sebebidir. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#0f172a" />
    <title>Oyun Odası</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
